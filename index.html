<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הזמנת קייטרינג | Shir's Boutique</title>
<style>
  :root {
    --pink:    #FFD6E0;
    --pink-d:  #F0A8C0;
    --gold:    #D4AF37;
    --gold-d:  #9a7208;
    --dark:    #1a1a1a;
    --white:   #ffffff;
    --green:   #25D366;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fdf5f8;
    color: #2a1a20;
    min-height: 100vh;
    padding-bottom: 120px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #1a0d10, #2d1520);
    color: white;
    text-align: center;
    padding: 28px 20px 20px;
    border-bottom: 3px solid var(--gold);
  }
  header .brand { font-size: 11px; letter-spacing: 4px; color: var(--gold); margin-bottom: 6px; }
  header h1 { font-size: 22px; font-weight: 700; color: white; }
  header .sub { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }

  /* ── CUSTOMER INFO ── */
  .info-box {
    background: white;
    margin: 16px 12px;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    border: 1.5px solid var(--pink);
  }
  .info-box h2 {
    font-size: 14px; color: var(--gold-d); letter-spacing: 1px;
    margin-bottom: 14px; border-bottom: 1px solid var(--pink); padding-bottom: 8px;
  }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-grid.one { grid-template-columns: 1fr; }
  .field label { font-size: 11px; font-weight: 700; color: #888; display: block; margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid #e8d0da; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fdf5f8;
    color: var(--dark); direction: rtl; outline: none;
    transition: border-color .2s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--pink-d); }
  .field textarea { resize: vertical; min-height: 60px; }

  /* ── CATEGORY ── */
  .category {
    margin: 16px 12px 0;
  }
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #1a0d10, #2d1520);
    color: var(--gold);
    padding: 12px 16px;
    border-radius: 12px 12px 0 0;
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; user-select: none;
  }
  .cat-header .arrow { transition: transform .25s; font-size: 12px; }
  .cat-header.open .arrow { transform: rotate(180deg); }
  .cat-body {
    background: white;
    border: 1.5px solid var(--pink);
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }

  /* ── ITEM ROW ── */
  .item {
    padding: 12px 16px;
    border-bottom: 1px solid #fce8f0;
    transition: background .15s;
  }
  .item:last-child { border-bottom: none; }
  .item.selected { background: #fff5f8; }
  .item-top { display: flex; align-items: flex-start; gap: 10px; }
  .item-info { flex: 1; }
  .item-name { font-size: 14px; font-weight: 700; color: #2a1a20; }
  .item-desc { font-size: 11px; color: #999; margin-top: 2px; line-height: 1.5; }
  .item-note-field { font-size: 11px; color: #777; margin-top: 2px; font-style: italic; }
  .item-price { font-size: 13px; font-weight: 700; color: var(--gold-d); white-space: nowrap; }

  /* qty */
  .qty-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--pink-d); background: white;
    color: #2a1a20; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s;
    flex-shrink: 0;
  }
  .qty-btn:hover { background: var(--pink); }
  .qty-num { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }
  .choice-input {
    margin-top: 8px; width: 100%; padding: 7px 10px;
    border: 1.5px solid #e8d0da; border-radius: 6px;
    font-size: 12px; font-family: inherit; color: #444; direction: rtl;
    background: #fdf5f8; outline: none;
  }
  .choice-input:focus { border-color: var(--pink-d); }

  /* ── STICKY TOTAL ── */
  .sticky-total {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 2px solid var(--pink);
    padding: 10px 16px 14px;
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: #888; margin-bottom: 2px;
  }
  .total-row.main { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
  .total-row.discount { color: var(--gold-d); font-weight: 600; }
  .total-row.final { font-size: 17px; font-weight: 900; color: #1a0d10; }
  .discount-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--gold-d); font-weight: 600;
    margin-bottom: 6px; cursor: pointer;
  }
  .discount-toggle input { accent-color: var(--gold); width: 16px; height: 16px; cursor: pointer; }

  .send-btn {
    width: 100%; background: var(--green); color: white;
    border: none; border-radius: 50px; padding: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .2s;
  }
  .send-btn:hover { background: #1ebe5d; }
  .send-btn:disabled { background: #ccc; cursor: not-allowed; }

  /* ── EMPTY STATE ── */
  .empty-msg { text-align: center; color: #ccc; font-size: 12px; padding: 6px 0; }

  /* responsive */
  @media (max-width: 400px) {
    .field-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">SHIR'S BOUTIQUE · קייטרינג חלבי ומגשי אירוח</div>
  <h1>טופס הזמנת קייטרינג</h1>
  <div class="sub">בחרו מהתפריט ושלחו — נחזור אליכם עם אישור ותשלום</div>
</header>

<!-- פרטי לקוח -->
<div class="info-box">

    </div>

      <input type="tel" id="phone" placeholder="05X-XXXXXXX">
    </div>

      <input type="date" id="event-date">

      <input type="number" id="guests" placeholder="מספר אורחים" min="1">
    </div>
  </div>
  <div class="field-grid one" style="margin-top:10px;">
    <div class="field">
      <label>סוג האירוע / הערות</label>
      <textarea id="notes" placeholder="ברית, שבת, ימי עיון, בקשות מיוחדות..."></textarea>
    </div>
  </div>
</div>

<!-- תפריט -->
<div id="menu-container"></div>

<!-- sticky total -->
<div class="sticky-total">
  <div class="total-row main">
    <span>סה"כ לפני הנחה</span>
    <span id="subtotal-display">0 ₪</span>

  </label>
  <div class="total-row discount" id="discount-row" style="display:none;">
    <span>הנחה (15%)</span>
    <span id="discount-display">0 ₪</span>
  </div>
  <div class="total-row final">
    <span>סה"כ לתשלום</span>
    <span id="total-display">0 ₪</span>
  </div>
  <button class="send-btn" id="send-btn" onclick="sendOrder()">

    שלח הזמנה לשיר בוואטסאפ

</div>

// ── State ──────────────────────────────────────────
const state = {};

// ── Build DOM ─────────────────────────────────────
function buildMenu() {
  const container = document.getElementById('menu-container');
  MENU.forEach((section, si) => {
    const div = document.createElement('div');
    div.className = 'category';

    const header = document.createElement('div');
    header.className = 'cat-header open';
    header.innerHTML = `<span>${section.cat}</span><span class="arrow">▲</span>`;
    header.onclick = () => {
      body.style.display = body.style.display === 'none' ? '' : 'none';
      header.classList.toggle('open');
    };

    const body = document.createElement('div');
    body.className = 'cat-body';

    section.items.forEach(item => {
      state[item.id] = 0;
      const row = document.createElement('div');
      row.className = 'item';
      row.id = `row-${item.id}`;

      const priceLabel = item.priceNote
        ? `${item.price} ₪ <span style="font-size:10px;color:#aaa;">(${item.priceNote})</span>`
        : `${item.price} ₪`;

      row.innerHTML = `
        <div class="item-top">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            ${item.note ? `<div class="item-note-field">${item.note}</div>` : ''}
          </div>
          <div class="item-price">${priceLabel}</div>
        </div>
        <div class="qty-wrap">
          <button class="qty-btn" onclick="change('${item.id}',-1)">−</button>
          <span class="qty-num" id="qty-${item.id}">0</span>
          <button class="qty-btn" onclick="change('${item.id}',1)">+</button>
          <span style="font-size:11px;color:#bbb;margin-right:4px;">מגשים</span>
        </div>
        ${item.choice ? `<input class="choice-input" id="choice-${item.id}" placeholder="${item.choice}" style="display:none;">` : ''}
      `;
      body.appendChild(row);
    });

    div.appendChild(header);
    div.appendChild(body);
    container.appendChild(div);
  });
}

function change(id, delta) {
  state[id] = Math.max(0, (state[id] || 0) + delta);
  document.getElementById(`qty-${id}`).textContent = state[id];
  const row = document.getElementById(`row-${id}`);
  row.classList.toggle('selected', state[id] > 0);
  const choiceEl = document.getElementById(`choice-${id}`);
  if (choiceEl) choiceEl.style.display = state[id] > 0 ? 'block' : 'none';
  recalc();
}

function recalc() {
  let subtotal = 0;
  MENU.forEach(section => {
    section.items.forEach(item => {
      subtotal += item.price * (state[item.id] || 0);
    });
  });
  const hasDiscount = document.getElementById('discount-check').checked;
  const discount = hasDiscount ? Math.round(subtotal * 0.15) : 0;
  const total = subtotal - discount;

  document.getElementById('subtotal-display').textContent = subtotal.toLocaleString() + ' ₪';
  document.getElementById('discount-display').textContent = '-' + discount.toLocaleString() + ' ₪';
  document.getElementById('total-display').textContent = total.toLocaleString() + ' ₪';
  document.getElementById('discount-row').style.display = hasDiscount && subtotal > 0 ? 'flex' : 'none';
}

function sendOrder() {
  const name      = document.getElementById('name').value.trim();
  const phone     = document.getElementById('phone').value.trim();
  const eventDate = document.getElementById('event-date').value;
  const guests    = document.getElementById('guests').value.trim();
  const notes     = document.getElementById('notes').value.trim();

  if (!name)  { alert('נא להזין שם מלא'); return; }
  if (!phone) { alert('נא להזין מספר טלפון'); return; }

  const selected = [];
  MENU.forEach(section => {
    const catItems = [];
    section.items.forEach(item => {
      if ((state[item.id] || 0) > 0) {
        const choiceEl = document.getElementById(`choice-${item.id}`);
        const choiceVal = choiceEl ? choiceEl.value.trim() : '';
        catItems.push({ name: item.name, qty: state[item.id], price: item.price, choice: choiceVal });
      }
    });
    if (catItems.length > 0) selected.push({ cat: section.cat, items: catItems });
  });

  if (selected.length === 0) { alert('נא לבחור לפחות פריט אחד'); return; }

  let subtotal = 0;
  selected.forEach(s => s.items.forEach(i => { subtotal += i.price * i.qty; }));
  const hasDiscount = document.getElementById('discount-check').checked;
  const discount = hasDiscount ? Math.round(subtotal * 0.15) : 0;
  const total = subtotal - discount;

  // בנה הודעה
  let msg = `*הזמנת קייטרינג חדשה - Shir's Boutique* 🌸\n\n`;
  msg += `*שם לקוח:* ${name}\n`;
  msg += `*טלפון:* ${phone}\n`;
  if (eventDate) msg += `*תאריך אירוע:* ${new Date(eventDate).toLocaleDateString('he-IL')}\n`;
  if (guests) msg += `*כמות אורחים:* ${guests}\n`;
  if (notes) msg += `*סוג אירוע / הערות:* ${notes}\n`;
  msg += '\n';

  selected.forEach(section => {
    msg += `*${section.cat}*\n`;
    section.items.forEach(item => {
      msg += `• ${item.name} × ${item.qty} = ${(item.price * item.qty).toLocaleString()} ₪`;
      if (item.choice) msg += `\n  ↳ ${item.choice}`;
      msg += '\n';
    });
    msg += '\n';
  });

  msg += `*סכום לפני הנחה:* ${subtotal.toLocaleString()} ₪\n`;
  if (hasDiscount) {
    msg += `*הנחת השקה 15%:* -${discount.toLocaleString()} ₪\n`;
  }
  msg += `*סה"כ לתשלום:* ${total.toLocaleString()} ₪`;

  const url = `https://wa.me/972534247937?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

buildMenu();
recalc();
</script>
